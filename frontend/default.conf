# Nginx site configuration for bldrdojo.com

server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.com www.bldrdojo.com localhost;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bldrdojo.com www.bldrdojo.com localhost;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /accounts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django serves login/auth at / and /login/
    location = / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /login {
        return 301 /login/;
    }
    location = /login/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Authenticated SPAs under /app/{name}/
    location = /app/people { return 301 /app/people/; }
    location /app/people/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/people/index.html;
    }
    location = /app/cad { return 301 /app/cad/; }
    location /app/cad/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/cad/index.html;
    }
    location = /app/food { return 301 /app/food/; }
    location /app/food/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/food/index.html;
    }
    location = /app/email { return 301 /app/email/; }
    location /app/email/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/email/index.html;
    }
    location = /app/gmail { return 301 /app/gmail/; }
    location /app/gmail/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/gmail/index.html;
    }
    location = /app/gallery { return 301 /app/gallery/; }
    location /app/gallery/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/gallery/index.html;
    }

    # Public gallery viewer: /{username}/gallery/{slug}
    location ~ ^/(?!app(?:/|$)|admin(?:/|$)|accounts(?:/|$)|api(?:/|$)|static(?:/|$)|media(?:/|$)|login(?:/|$)|health(?:/|$))([^/]+)/gallery(?:/|$) {
        root /usr/share/nginx/html;
        try_files /app/gallery/index.html =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default: redirect to login
    location / {
        return 301 /login/;
    }

    # Preserve intended destination when 404 so login can redirect back
    error_page 404 =302 /login/?next=$uri;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
