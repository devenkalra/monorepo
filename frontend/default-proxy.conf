# Proxy mode: nginx runs behind an edge reverse proxy that owns :80/:443.
# This container serves bldrdojo app and backend routes over plain HTTP on an internal port.
server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.com www.bldrdojo.com localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /accounts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location ~ ^/login/?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /people-app/ {
        alias /usr/share/nginx/html/people-app/;
        try_files $uri $uri/ /people-app/index.html;
    }

    location /cad-app/ {
        alias /usr/share/nginx/html/cad-app/;
        try_files $uri $uri/ /cad-app/index.html;
    }

    location = /food-app {
        return 301 /food-app/;
    }

    location /food-app/ {
        alias /usr/share/nginx/html/food-app/;
        try_files $uri $uri/ /food-app/index.html;
    }

    location = /email-app {
        return 301 /email-app/;
    }

    location /email-app/ {
        alias /usr/share/nginx/html/email-app/;
        try_files $uri $uri/ /email-app/index.html;
    }

    location = /gmail-app {
        return 301 /gmail-app/;
    }

    location /gmail-app/ {
        alias /usr/share/nginx/html/gmail-app/;
        try_files $uri $uri/ /gmail-app/index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 /login/;
    }

    error_page 404 =302 /login/?next=$uri;
}
