# Proxy mode: nginx runs behind an edge reverse proxy that owns :80/:443.
# This container serves bldrdojo app and backend routes over plain HTTP on an internal port.
server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.com www.bldrdojo.com localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /accounts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location ~ ^/login/?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location = /people-app { return 301 /app/people/; }
    location /people-app/ { return 301 /app/people/; }
    location = /cad-app { return 301 /app/cad/; }
    location /cad-app/ { return 301 /app/cad/; }
    location = /food-app { return 301 /app/food/; }
    location /food-app/ { return 301 /app/food/; }
    location = /gmail-app { return 301 /app/gmail/; }
    location /gmail-app/ { return 301 /app/gmail/; }
    location = /app/people { return 301 /app/people/; }
    location /app/people/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/people/index.html;
    }
    location = /app/cad { return 301 /app/cad/; }
    location /app/cad/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/cad/index.html;
    }
    location = /app/food { return 301 /app/food/; }
    location /app/food/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/food/index.html;
    }
    location = /app/email { return 301 /app/email/; }
    location /app/email/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/email/index.html;
    }
    location = /app/gmail { return 301 /app/gmail/; }
    location /app/gmail/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/gmail/index.html;
    }
    location = /app/gallery { return 301 /app/gallery/; }
    location /app/gallery/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/gallery/index.html;
    }
    location = /app/vacation { return 301 /app/vacation/; }
    location /app/vacation/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/vacation/index.html;
    }

    location ~ ^/(?!app(?:/|$)|admin(?:/|$)|accounts(?:/|$)|api(?:/|$)|static(?:/|$)|media(?:/|$)|login(?:/|$)|health(?:/|$))([^/]+)/gallery(?:/|$) {
        root /usr/share/nginx/html;
        try_files /app/gallery/index.html =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 /login/;
    }

    error_page 404 =302 /login/?next=$uri;
}
