# Local development - HTTP only, no SSL
# Auth from Django at / and /login/
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 bldrdojo.com www.bldrdojo.com;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /accounts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location = / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /login/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /people-app/ {
        alias /usr/share/nginx/html/people-app/;
        try_files $uri $uri/ /people-app/index.html;
    }

    location /cad-app/ {
        alias /usr/share/nginx/html/cad-app/;
        try_files $uri $uri/ /cad-app/index.html;
    }

    location = /food-app {
        return 301 /food-app/;
    }

    location /food-app/ {
        alias /usr/share/nginx/html/food-app/;
        try_files $uri $uri/ /food-app/index.html;
    }

    location = /email-app {
        return 301 /email-app/;
    }

    location /email-app/ {
        alias /usr/share/nginx/html/email-app/;
        try_files $uri $uri/ /email-app/index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 /login/;
    }

    # Preserve intended destination when 404 (e.g. /food-app/ not found) so login can redirect back
    error_page 404 =302 /login/?next=$uri;
}
