version: 2.1

jobs:
  test-data-backend:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:15.3
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
      - image: getmeili/meilisearch:v1.5
        environment:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
      - image: neo4j:5-community
        environment:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
      - image: cimg/redis:7.0
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: test_master_key
      REDIS_URL: redis://localhost:6379
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "True"
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            cd data-backend
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Wait for service containers
          command: |
            python - <<'PY'
            import socket
            import time

            targets = [
                ("PostgreSQL", "127.0.0.1", 5432),
                ("MeiliSearch", "127.0.0.1", 7700),
                ("Neo4j", "127.0.0.1", 7687),
                ("Redis", "127.0.0.1", 6379),
            ]

            for name, host, port in targets:
                ready = False
                for _ in range(60):
                    with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                        s.settimeout(1.0)
                        if s.connect_ex((host, port)) == 0:
                            ready = True
                            print(f"{name} ready on {host}:{port}")
                            break
                    time.sleep(1)
                if not ready:
                    raise SystemExit(f"Timed out waiting for {name} on {host}:{port}")
            PY
      - run:
          name: Run data-backend tests
          command: |
            cd data-backend
            python manage.py test people.tests.test_integration_full_stack --verbosity=2

workflows:
  ci:
    jobs:
      - test-data-backend