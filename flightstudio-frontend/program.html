<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlightStudio · segment harness</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #11151c;
    --panel: #171d26;
    --card: #1c2430;
    --line: #273040;
    --text: #dde3ec;
    --dim: #8b96a8;
    --accent: #4ea3f0;
    --warn: #f0a848;
    --bad: #f05e6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header h1 small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  header .spacer { flex: 1; }
  #summary { color: var(--dim); font-variant-numeric: tabular-nums; }
  #summary b { color: var(--text); font-weight: 600; }

  main { flex: 1; display: grid; grid-template-columns: 420px 1fr; min-height: 0; }
  #editor { background: var(--panel); border-right: 1px solid var(--line);
            overflow-y: auto; padding: 10px; }
  #view { display: grid; grid-template-rows: 1fr 196px; min-height: 0; }
  #map { height: 100%; background: #0d1117; }
  #bottom { border-top: 1px solid var(--line); background: var(--panel);
            display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #profile { width: 100%; height: 100%; display: block; }

  #transport { display: flex; align-items: center; gap: 10px; padding: 6px 10px;
               border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
  #transport .spacer { flex: 1 1 auto; min-width: 4px; }
  #play { flex: 0 0 auto; width: 30px; text-align: center; }
  #playhead { flex: 1 1 220px; min-width: 90px; accent-color: var(--accent); }
  #clock, #pose { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px;
                  white-space: nowrap; }
  #clock { flex: 0 0 auto; }
  #pose { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  #chart-tabs { display: flex; flex: 0 0 auto; }
  #pose b { color: var(--text); font-weight: 500; }
  #chart-tabs button { border-radius: 0; margin-left: -1px; background: #0f141b; }
  #chart-tabs button.on { background: #27405c; border-color: var(--accent); color: #fff; }

  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 0 4px; }

  .row { display: grid; grid-template-columns: 96px 1fr 76px 16px; gap: 8px;
         align-items: center; margin-bottom: 5px; }
  .row > label { color: var(--dim); font-size: 12px; }
  .row .unit { color: var(--dim); font-size: 11px; }
  input, select, textarea, button {
    font: inherit; color: var(--text); background: #0f141b;
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px;
  }
  input[type=number] { width: 100%; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; padding: 0; accent-color: var(--accent); background: none; border: none; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  button { cursor: pointer; background: #222c3a; }
  button:hover { border-color: var(--accent); }
  button.ghost { background: none; color: var(--dim); border-color: transparent; padding: 2px 6px; }
  button.ghost:hover { color: var(--text); border-color: var(--line); }

  .card { background: var(--card); border: 1px solid var(--line); border-left-width: 4px;
          border-radius: 6px; margin-bottom: 8px; padding: 8px 10px; }
  .card.active { border-color: var(--accent); }
  .card.bad { border-color: var(--bad); }
  .card > header { background: none; border: none; padding: 0 0 6px; gap: 6px; }
  .card .kind { font-weight: 600; }
  .card .name { background: none; border: none; border-bottom: 1px dashed transparent;
                color: var(--dim); padding: 0 2px; width: 110px; }
  .card .name:hover, .card .name:focus { border-bottom-color: var(--line); outline: none; }
  .readout { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums;
             border-top: 1px solid var(--line); margin-top: 7px; padding-top: 6px;
             display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; }
  .readout b { color: var(--text); font-weight: 500; }

  /* A pin holds a parameter against the solver; it only appears on the
     parameters the solver could otherwise move. */
  .pin { cursor: pointer; font-size: 12px; line-height: 1; opacity: .25;
         background: none; border: none; padding: 0; color: var(--text); }
  .pin:hover { opacity: .6; }
  .pin.on { opacity: 1; color: var(--accent); }
  .row.pinned > label { color: var(--accent); }

  .dof { grid-column: 1 / -1; margin-top: 4px; padding-top: 4px;
         border-top: 1px dashed var(--line); }
  .dof.short { color: #e0b050; }
  .dof.bad { color: var(--bad); }
  .constraint { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center;
                margin: 2px 0; }
  .constraint input[type=number] { width: 100%; min-width: 0; }
  .constraint .lock { font-size: 11px; color: var(--dim); display: flex;
                      align-items: center; gap: 3px; white-space: nowrap; }
  .seam-note { color: var(--warn); }
  .help { color: var(--dim); font-size: 11px; margin: -2px 0 6px; grid-column: 1 / -1; }
  .group { color: var(--dim); font-size: 10.5px; text-transform: uppercase;
           letter-spacing: .07em; border-top: 1px solid var(--line);
           margin: 8px 0 6px; padding-top: 5px; }

  .add { display: flex; gap: 6px; margin-bottom: 10px; }
  .add button { flex: 1; }

  #error { padding: 7px 14px; background: #3a1d22; color: #ffd9dd;
           border-top: 1px solid var(--bad); font-size: 12px; }
  #error b { color: #fff; }
  textarea { width: 100%; height: 130px; font-family: ui-monospace, Menlo, Consolas, monospace;
             font-size: 11px; resize: vertical; }
  .leaflet-container { background: #0d1117; }
  .leaflet-tooltip { background: #1c2430; border: 1px solid var(--line); color: var(--text); }
  .leaflet-tooltip::before { display: none; }
</style>
</head>
<body>

<header>
  <h1>Segment harness <small>stages 1&ndash;4 &mdash; geometry, timing, solver, curves</small></h1>
  <label>preset
    <select id="preset">
      <option value="">—</option>
    </select>
  </label>
  <label>speed as
    <select id="speed-mode">
      <option value="handles">entry / exit</option>
      <option value="coefficients">coefficients</option>
    </select>
  </label>
  <label>step
    <input id="step" type="number" value="20" min="2" max="500" step="1" style="width:62px">
    <span class="unit">m</span>
  </label>
  <label>fit to
    <input id="fit" type="number" min="1" step="1" placeholder="s" style="width:66px">
    <button id="fit-apply">Retime</button>
  </label>
  <div class="spacer"></div>
  <div id="summary"></div>
  <a href="./" style="color:var(--dim)">main app</a>
</header>

<main>
  <aside id="editor">
    <fieldset>
      <legend>origin</legend>
      <div class="row">
        <label for="origin-lat">latitude</label>
        <input id="origin-lat" type="number" step="0.0001"><span class="unit">°</span>
      </div>
      <div class="row">
        <label for="origin-lon">longitude</label>
        <input id="origin-lon" type="number" step="0.0001"><span class="unit">°</span>
      </div>
      <div class="row">
        <label for="origin-alt">altitude</label>
        <input id="origin-alt" type="number" step="100"><span class="unit">ft</span>
      </div>
    </fieldset>

    <div class="add" id="add"></div>
    <div id="segments"></div>

    <fieldset>
      <legend>program json</legend>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="add" style="margin:6px 0 0">
        <button id="json-apply">Apply</button>
        <button id="json-copy" class="ghost">Copy</button>
      </div>
    </fieldset>
  </aside>

  <section id="view">
    <div id="map"></div>
    <div id="bottom">
      <div id="transport">
        <button id="play" title="play / pause">&#9654;</button>
        <input id="playhead" type="range" min="0" max="1" step="0.0005" value="0">
        <span id="clock">0.0 s</span>
        <span id="pose"></span>
        <span class="spacer"></span>
        <span id="chart-tabs"></span>
      </div>
      <svg id="profile"></svg>
    </div>
  </section>
</main>

<div id="error" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./programFields.js"></script>
<script src="./program.js"></script>
</body>
</html>
