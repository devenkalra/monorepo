# Run from monorepo root (where people-frontend, cad-frontend, data-backend, frontend are siblings):
#   cd /path/to/monorepo
#   docker compose -f docker-compose.local.yml up --build
#
# This ensures frontend build context includes people-frontend and cad-frontend.

# Use same project name as data-backend so we reuse existing volumes/network
name: data-backend

services:
  db:
    extends:
      file: data-backend/docker-compose.local.yml
      service: db
  redis:
    extends:
      file: data-backend/docker-compose.local.yml
      service: redis
  meilisearch:
    extends:
      file: data-backend/docker-compose.local.yml
      service: meilisearch
  neo4j:
    extends:
      file: data-backend/docker-compose.local.yml
      service: neo4j
  vector-service:
    build:
      context: ./data-backend
      dockerfile: Dockerfile.vector
    container_name: bldrdojo-local-vector
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - vector_data_local:/app/data
    environment:
      - FLASK_ENV=development
      - VECTOR_DB_PATH=/app/data/chroma
      - CUDA_VISIBLE_DEVICES=
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  backend:
    build:
      context: ./data-backend
      dockerfile: Dockerfile
    container_name: bldrdojo-local-backend
    env_file:
      - data-backend/.env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data-backend:/app
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/media
      - cad_render_cache_local:/app/cad/render_cache
      - cad_textures_local:/app/cad/textures
      - cad_env_local:/app/cad/env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=local-dev-secret-key-change-in-production
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,bldrdojo.com,www.bldrdojo.com,bldrdojo.local,devenkalra.local,192.168.4.200
      - POSTGRES_DB=entitydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dbpassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:localredispass@redis:6379/0
      - REDIS_PASSWORD=localredispass
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=localmeilikey
      - MEILISEARCH_LOCAL_PORT=7701
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=localneo4jpass
      - VECTOR_SERVICE_URL=http://vector-service:5000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179
      - GOOGLE_OAUTH_CALLBACK_URL=http://localhost/app/people/auth/google/callback
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vector-service:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
  celery-worker:
    build:
      context: ./data-backend
      dockerfile: Dockerfile
    container_name: bldrdojo-local-celery-worker
    env_file:
      - data-backend/.env
    restart: unless-stopped
    volumes:
      - ./data-backend:/app
      - media_volume_local:/app/media
      - cad_render_cache_local:/app/cad/render_cache
      - cad_textures_local:/app/cad/textures
      - cad_env_local:/app/cad/env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=True
      - POSTGRES_DB=entitydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dbpassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Must override env_file REDIS_PASSWORD (prod value) for local redis
      - REDIS_URL=redis://:localredispass@redis:6379/0
      - REDIS_PASSWORD=localredispass
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=localmeilikey
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=localneo4jpass
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - backend-network
    command: celery -A config worker --loglevel=info --concurrency=2
  celery-beat:
    build:
      context: ./data-backend
      dockerfile: Dockerfile
    container_name: bldrdojo-local-celery-beat
    env_file:
      - data-backend/.env
    restart: unless-stopped
    volumes:
      - ./data-backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=True
      - POSTGRES_DB=entitydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dbpassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:localredispass@redis:6379/0
      - REDIS_PASSWORD=localredispass
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    command: celery -A config beat --loglevel=info
  email-frontend-dev:
    build:
      context: ./email-frontend
      dockerfile: Dockerfile
    container_name: bldrdojo-local-email-frontend-dev
    restart: unless-stopped
    ports:
      - "5176:5176"
    volumes:
      - ./email-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - backend-network
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BUILD_ENV: proxy
    container_name: bldrdojo-local-frontend
    restart: unless-stopped
    ports:
      # Bind on all interfaces so edge-nginx (via host.docker.internal) can reach it.
      # 127.0.0.1-only publishes are often unreachable from Docker Desktop containers.
      - "8080:80"
    volumes:
      - static_volume_local:/app/staticfiles:ro
      - media_volume_local:/app/media
    depends_on:
      - backend
    networks:
      - backend-network

  devenkalra-app:
    build:
      context: .
      dockerfile: devenkalra.com/Dockerfile
    container_name: devenkalra-local-app
    env_file:
      - devenkalra.com/backend/.env
    restart: unless-stopped
    ports:
      - "8090:8000"
    volumes:
      - ./devenkalra.com/backend/db.sqlite3:/app/db.sqlite3
      - ./devenkalra.com/backend/media:/app/media
      # Live-edit Python + templates without rebuilding the image
      - ./devenkalra.com/backend/core:/app/core
      - ./devenkalra.com/backend/audio_library:/app/audio_library
      - ./devenkalra.com/backend/backend/settings.py:/app/backend/settings.py:ro
      - ./devenkalra.com/backend/backend/urls.py:/app/backend/urls.py:ro
      - ./devenkalra.com/backend/.env:/app/.env:ro
      # Dedicated NAS user share (read-only). Default is an empty placeholder.
      - ${AUDIO_LIBRARY_HOST_MOUNT:-./devenkalra.com/backend/audio_library/empty}:/mnt/audio:ro
      # Local SPA: npm run build in devenkalra.com/frontend, then refresh :8090
      - ./devenkalra.com/frontend/dist:/app/frontend_dist:ro
    networks:
      - backend-network

volumes:
  postgres_data_local:
    name: bldrdojo-local-postgres-data
  redis_data_local:
    name: bldrdojo-local-redis-data
  meilisearch_data_local:
    name: bldrdojo-local-meilisearch-data
  neo4j_data_local:
    name: bldrdojo-local-neo4j-data
  neo4j_logs_local:
    name: bldrdojo-local-neo4j-logs
  vector_data_local:
    name: bldrdojo-local-vector-data
  static_volume_local:
    name: bldrdojo-local-static
  media_volume_local:
    name: bldrdojo-local-media
  cad_render_cache_local:
    name: bldrdojo-local-cad-render-cache
  cad_textures_local:
    name: bldrdojo-local-cad-textures
  cad_env_local:
    name: bldrdojo-local-cad-env

networks:
  backend-network:
    name: bldrdojo-local-backend-network
    driver: bridge
