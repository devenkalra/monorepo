        <style>
        /* --- Base & Reset Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 2.25rem;
            font-weight: 700;
            color: #1a1a1a;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 0.5rem;
        }

        /* --- Responsive CSS Grid Dashboard --- */
        .grid-container {
            display: grid;
            /* Automatically creates columns that shrink/expand down to 280px, fitting as many as possible per row */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* --- Card Styles --- */
        .book-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .cover-wrapper {
            width: 100%;
            height: 380px;
            background-color: #e9ecef;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .book-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.25rem;
            line-height: 1.3;
        }
        .book-author {
            font-size: 0.95rem;
            color: #4b5563;
            font-style: italic;
            margin-bottom: 1rem;
        }
        .book-description {
            font-size: 0.9rem;
            color: #6b7280;
            display: -webkit-box;
            -webkit-line-clamp: 4; /* Limits description text height gracefully */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
        
        <div class="container">

    <div id="cms-book-grid" class="grid-container"></div>
</div>

        function renderCmsBooks() {
            const grid = document.getElementById('cms-book-grid');
            const template = document.getElementById('cms-book-template');

            if (!grid || !template) return;
            grid.innerHTML = ''; // Safely clear out container properties

            booksData.forEach(book => {
                const cardInstance = template.content.cloneNode(true);
                
                // Set the Header text values explicitly
                cardInstance.querySelector('.custom-title').textContent = book.title;
                cardInstance.querySelector('.custom-author').textContent = book.author;
                
                // Map the responsive layout properties
                cardInstance.querySelector('.responsive-cover').src = book.cover_photo;
                cardInstance.querySelector('.responsive-cover').alt = `Cover art for ${book.title}`;
                cardInstance.querySelector('.book-description').textContent = book.description;
                
                grid.appendChild(cardInstance);
            });
        }

        // Execute immediately upon insertion to safely bypass timing issues
        renderCmsBooks();
    })();
</script>
