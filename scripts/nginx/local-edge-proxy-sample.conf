# Local host-level nginx config for multi-domain testing with Dockerized apps.
#
# Prereqs:
# - bldrdojo frontend container is published on 127.0.0.1:8080
# - optional second app is published on 127.0.0.1:8090
# - hosts file has entries like:
#     127.0.0.1 localhost
#     127.0.0.1 bldrdojo.local
#     127.0.0.1 devenkalra.local

# Vacation (/app/vacation/) and Trips (/app/trips/) are served by the
# bldrdojo frontend container, not by extra edge locations. Rebuild
# bldrdojo-local-frontend after adding those SPAs.
#
# Prefer container DNS when edge-nginx is on the app network
# (docker network connect bldrdojo-local-backend-network edge-nginx).
upstream bldrdojo_frontend_local {
    server bldrdojo-local-frontend:80;
}

upstream devenkalra_app_local {
    server devenkalra-local-app:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;
    client_max_body_size 100m;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://bldrdojo_frontend_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.local;
    client_max_body_size 100m;

    location / {
        proxy_pass http://bldrdojo_frontend_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devenkalra.local;
    client_max_body_size 100m;

    location / {
        proxy_pass http://devenkalra_app_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
