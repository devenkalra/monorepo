# Edge nginx config for multiple domains on one machine.
# Intended for use INSIDE the edge-nginx Docker container.
#
# Upstreams target host-published ports via host.docker.internal.

upstream bldrdojo_frontend {
    server host.docker.internal:8080;
}

upstream devenkalra_app {
    server host.docker.internal:8090;
}

# Default health endpoint for Docker healthchecks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 100m;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.com www.bldrdojo.com;
    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devenkalra.com www.devenkalra.com;
    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bldrdojo.com www.bldrdojo.com;
    client_max_body_size 100m;

    # Replace with your cert paths in the mounted letsencrypt directory
    ssl_certificate /etc/letsencrypt/live/bldrdojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bldrdojo.com/privkey.pem;

    location / {
        proxy_pass http://bldrdojo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devenkalra.com www.devenkalra.com;
    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/devenkalra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devenkalra.com/privkey.pem;

    location / {
        proxy_pass http://devenkalra_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

