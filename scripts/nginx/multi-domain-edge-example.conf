# Example host-level nginx config for multiple domains on one machine.
# Use this on the host (outside Docker) where :80/:443 are bound.

# Upstreams
upstream bldrdojo_frontend {
    server host.docker.internal:8080;
}

upstream devenkalra_app {
    # Replace with your other app/container published port
    server host.docker.internal:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name bldrdojo.com www.bldrdojo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bldrdojo.com www.bldrdojo.com;

    # Replace with your cert paths
    ssl_certificate /etc/letsencrypt/live/bldrdojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bldrdojo.com/privkey.pem;

    location / {
        proxy_pass http://bldrdojo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devenkalra.com www.devenkalra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devenkalra.com www.devenkalra.com;

    # Replace with your cert paths
    ssl_certificate /etc/letsencrypt/live/devenkalra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devenkalra.com/privkey.pem;

    location / {
        proxy_pass http://devenkalra_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
