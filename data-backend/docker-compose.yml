services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: bldrdojo-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-entitydb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and Celery)
  redis:
    image: redis:7-alpine
    container_name: bldrdojo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file:
      - .env
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MeiliSearch (Search Engine)
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: bldrdojo-meilisearch
    restart: unless-stopped
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    env_file:
      - .env
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j (Graph Database)
  neo4j:
    image: neo4j:5-community
    container_name: bldrdojo-neo4j
    restart: unless-stopped
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Vector Search Service (Flask) - DISABLED for faster builds
  # vector-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.vector
  #   container_name: bldrdojo-vector
  #   restart: unless-stopped
  #   volumes:
  #     - vector_data:/app/data
  #   environment:
  #     - FLASK_ENV=production
  #     - VECTOR_DB_PATH=/app/data/chroma
  #   env_file:
  #     - .env
  #   networks:
  #     - backend-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2'
  #         memory: 4G

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bldrdojo-backend
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - /var/lib/bldrdojo/media:/app/media
      - cad_render_cache:/app/cad/render_cache
      - cad_textures:/app/cad/textures
      - cad_env:/app/cad/env
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_DB=${POSTGRES_DB:-entitydb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GOOGLE_OAUTH_CALLBACK_URL=${GOOGLE_OAUTH_CALLBACK_URL:-https://bldrdojo.com/auth/google/callback}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - config.wsgi:application
      "

  # Celery Worker for async tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bldrdojo-celery-worker
    restart: unless-stopped
    volumes:
      - /var/lib/bldrdojo/media:/app/media
      - cad_render_cache:/app/cad/render_cache
      - cad_textures:/app/cad/textures
      - cad_env:/app/cad/env
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_DB=${POSTGRES_DB:-entitydb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - backend-network
    command: celery -A config worker --loglevel=info --concurrency=2 --max-memory-per-child=250000

  # React Frontend with Nginx (container + people + cad)
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: bldrdojo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - /var/lib/bldrdojo/media:/app/media
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: bldrdojo-postgres-data
  redis_data:
    name: bldrdojo-redis-data
  meilisearch_data:
    name: bldrdojo-meilisearch-data
  neo4j_data:
    name: bldrdojo-neo4j-data
  neo4j_logs:
    name: bldrdojo-neo4j-logs
  # vector_data:  # Disabled - vector service not in use
  #   name: bldrdojo-vector-data
  cad_render_cache:
    name: bldrdojo-cad-render-cache
  cad_textures:
    name: bldrdojo-cad-textures
  cad_env:
    name: bldrdojo-cad-env
  static_volume:
    name: bldrdojo-static

networks:
  backend-network:
    name: bldrdojo-backend-network
    driver: bridge
  frontend-network:
    name: bldrdojo-frontend-network
    driver: bridge
