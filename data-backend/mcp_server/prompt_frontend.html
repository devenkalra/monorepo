<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bldrdojo MCP Prompt Frontend</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #fffdfa;
      --ink: #1f2937;
      --muted: #6b7280;
      --brand: #0f766e;
      --brand-2: #0ea5e9;
      --line: #e5e7eb;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(14,165,233,0.08), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(15,118,110,0.10), transparent 40%),
        var(--bg);
      min-height: 100vh;
    }

    .wrap {
      max-width: 980px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .header {
      padding: 1rem 1.25rem;
      background: linear-gradient(90deg, rgba(15,118,110,0.10), rgba(14,165,233,0.10));
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sub {
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .content {
      padding: 1rem 1.25rem 1.25rem;
      display: grid;
      gap: 0.9rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font: inherit;
      background: #ffffff;
      color: var(--ink);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-weight: 650;
      padding: 0.62rem 0.95rem;
      cursor: pointer;
    }

    button[disabled] {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      color: var(--error);
      font-size: 0.92rem;
      white-space: pre-wrap;
    }

    .output {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 0.85rem;
      min-height: 120px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    details {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 0.65rem 0.8rem;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
    }

    pre {
      margin: 0.65rem 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.86rem;
      color: #111827;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 10px;
      padding: 0.75rem;
    }

    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      .wrap { margin: 1rem auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>bldrdojo Prompt Frontend</h1>
        <div class="sub">LLM prompt UI backed by MCP tools from your local server.</div>
        <div class="sub" id="frontendVersion">Version __FRONTEND_VERSION__</div>
      </div>

      <div class="content">
        <div class="actions">
          <button id="googleBtn" type="button">Sign in with Google</button>
          <span id="authStatus" class="status">Not authenticated</span>
        </div>

        <div class="row">
          <div>
            <label for="apiKey">LLM API Key</label>
            <input id="apiKey" type="password" placeholder="Optional: leave blank to use OPENAI_API_KEY from .env/env" autocomplete="off" />
          </div>
          <div>
            <label for="model">Model</label>
            <input id="model" type="text" value="gpt-5.4-mini" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="sessionId">Session ID (MCP auth/tool state)</label>
            <input id="sessionId" type="text" value="web-default" />
          </div>
          <div>
            <label for="apiBase">Frontend API Base URL</label>
            <input id="apiBase" type="text" value="" placeholder="http://127.0.0.1:8787" />
          </div>
        </div>

        <div>
          <label for="prompt">Prompt</label>
          <textarea id="prompt" placeholder="Ask something that may require tools, for example: list my recent entities and summarize them."></textarea>
        </div>

        <div class="actions">
          <button id="sendBtn">Send</button>
          <span id="status" class="status">Idle</span>
        </div>

        <div id="error" class="error"></div>

        <div>
          <label>Assistant Answer</label>
          <div id="answer" class="output"></div>
        </div>

        <details>
          <summary>Tool Trace</summary>
          <pre id="trace"></pre>
        </details>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const sendBtn = document.getElementById('sendBtn');
    const googleBtn = document.getElementById('googleBtn');
    const statusEl = document.getElementById('status');
    const authStatusEl = document.getElementById('authStatus');
    const errorEl = document.getElementById('error');
    const answerEl = document.getElementById('answer');
    const traceEl = document.getElementById('trace');

    const defaultBase = window.location.protocol === 'file:'
      ? 'http://127.0.0.1:8787'
      : window.location.origin;
    document.getElementById('apiBase').value = defaultBase;

    let googleTokenClient = null;

    async function refreshAuthStatus() {
      const sessionId = document.getElementById('sessionId').value.trim() || 'web-default';
      const apiBase = document.getElementById('apiBase').value.trim() || defaultBase;
      try {
        const resp = await fetch(`${apiBase}/api/auth/status?session_id=${encodeURIComponent(sessionId)}`);
        const data = await resp.json();
        if (resp.ok && data.ok && data.data && data.data.authenticated) {
          const user = data.data.user || {};
          const label = user.email || user.username || user.pk || 'unknown-user';
          const count = Number.isInteger(data.data.entities_count) ? data.data.entities_count : '?';
          authStatusEl.textContent = `Authenticated as ${label} (entities: ${count})`;
        } else {
          authStatusEl.textContent = 'Not authenticated';
        }
      } catch (_) {
        authStatusEl.textContent = 'Auth status unknown';
      }
    }

    async function signInWithGoogle() {
      errorEl.textContent = '';
      const apiBase = document.getElementById('apiBase').value.trim() || defaultBase;
      const sessionId = document.getElementById('sessionId').value.trim() || 'web-default';

      googleBtn.disabled = true;
      authStatusEl.textContent = 'Starting Google sign-in...';
      try {
        const cfgResp = await fetch(`${apiBase}/api/google/config`);
        const cfg = await cfgResp.json();
        if (!cfgResp.ok || !cfg.ok || !cfg.data || !cfg.data.client_id) {
          throw new Error('Could not load Google OAuth config.');
        }

        const clientId = cfg.data.client_id;
        const scope = cfg.data.scope || 'openid profile email';

        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope,
          callback: async (tokenResponse) => {
            if (!tokenResponse || !tokenResponse.access_token) {
              errorEl.textContent = 'Google sign-in failed: no access token returned.';
              authStatusEl.textContent = 'Not authenticated';
              googleBtn.disabled = false;
              return;
            }

            try {
              const exchangeResp = await fetch(`${apiBase}/api/google/exchange`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  access_token: tokenResponse.access_token,
                  session_id: sessionId,
                }),
              });
              const exchangeData = await exchangeResp.json();
              if (!exchangeResp.ok || !exchangeData.ok) {
                throw new Error(JSON.stringify(exchangeData.error || { message: 'Exchange failed' }, null, 2));
              }

              await refreshAuthStatus();
            } catch (err) {
              errorEl.textContent = String(err.message || err);
              authStatusEl.textContent = 'Not authenticated';
            } finally {
              googleBtn.disabled = false;
            }
          },
        });

        googleTokenClient.requestAccessToken({ prompt: 'consent' });
      } catch (err) {
        errorEl.textContent = String(err.message || err);
        authStatusEl.textContent = 'Not authenticated';
        googleBtn.disabled = false;
      }
    }

    async function sendPrompt() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value.trim() || 'gpt-5.4-mini';
      const sessionId = document.getElementById('sessionId').value.trim() || 'web-default';
      const apiBase = document.getElementById('apiBase').value.trim() || defaultBase;
      const prompt = document.getElementById('prompt').value.trim();

      errorEl.textContent = '';
      answerEl.textContent = '';
      traceEl.textContent = '';

      if (!prompt) {
        errorEl.textContent = 'Prompt is required.';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'Running...';

      try {
        const response = await fetch(`${apiBase}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            api_key: apiKey,
            model,
            session_id: sessionId,
            prompt,
          }),
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          const details = data && data.error ? JSON.stringify(data.error, null, 2) : 'Unknown error';
          throw new Error(details);
        }

        answerEl.textContent = data.data.answer || '';
        traceEl.textContent = JSON.stringify(data.data.trace || [], null, 2);
        statusEl.textContent = 'Done';
      } catch (err) {
        statusEl.textContent = 'Failed';
        errorEl.textContent = String(err.message || err);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendPrompt);
    googleBtn.addEventListener('click', signInWithGoogle);
    document.getElementById('prompt').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        sendPrompt();
      }
    });

    refreshAuthStatus();
  </script>
</body>
</html>
