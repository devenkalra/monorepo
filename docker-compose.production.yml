# Production deployment - run from monorepo root:
#   cd /path/to/monorepo
#   docker compose -f docker-compose.production.yml up -d
#
# Requires: data-backend/.env, data-backend/ssl/, data-backend/backups/
# Build context: monorepo root (people-frontend, cad-frontend, food-frontend, frontend)

services:
  db:
    extends:
      file: data-backend/docker-compose.yml
      service: db
  redis:
    extends:
      file: data-backend/docker-compose.yml
      service: redis
  meilisearch:
    extends:
      file: data-backend/docker-compose.yml
      service: meilisearch
  neo4j:
    extends:
      file: data-backend/docker-compose.yml
      service: neo4j
  backend:
    extends:
      file: data-backend/docker-compose.yml
      service: backend
    env_file:
      - data-backend/.env  # Ensures GOOGLE_* etc. load when run from prod root
    build:
      context: ./data-backend
      dockerfile: Dockerfile
  celery-worker:
    extends:
      file: data-backend/docker-compose.yml
      service: celery-worker
    env_file:
      - data-backend/.env
    build:
      context: ./data-backend
      dockerfile: Dockerfile
  celery-beat:
    extends:
      file: data-backend/docker-compose.yml
      service: celery-beat
    env_file:
      - data-backend/.env
    build:
      context: ./data-backend
      dockerfile: Dockerfile
  frontend:
    extends:
      file: data-backend/docker-compose.yml
      service: frontend
    ports:
      - "8080:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BUILD_ENV: proxy

  devenkalra-app:
    build:
      context: .
      dockerfile: devenkalra.com/Dockerfile
    env_file:
      - devenkalra.com/backend/.env
    volumes:
      - ./devenkalra.com/backend/db.sqlite3:/app/db.sqlite3
      - ./devenkalra.com/backend/media:/app/media
      - ./devenkalra.com/backend/.env:/app/.env:ro
    ports:
      - "8090:8000"
    restart: unless-stopped

volumes:
  postgres_data:
    name: bldrdojo-postgres-data
    external: true
  redis_data:
    name: bldrdojo-redis-data
    external: true
  meilisearch_data:
    name: bldrdojo-meilisearch-data
    external: true
  neo4j_data:
    name: bldrdojo-neo4j-data
    external: true
  neo4j_logs:
    name: bldrdojo-neo4j-logs
    external: true
  cad_render_cache:
    name: bldrdojo-cad-render-cache
    external: true
  cad_textures:
    name: bldrdojo-cad-textures
    external: true
  cad_env:
    name: bldrdojo-cad-env
    external: true
  static_volume:
    name: bldrdojo-static
    external: true

networks:
  backend-network:
    name: bldrdojo-backend-network
    external: true
  frontend-network:
    name: bldrdojo-frontend-network
    external: true
